services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # command: python -m debugpy --listen 0.0.0.0:5680 --wait-for-client -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
      - "5680:5680"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - .:/app
      - /app/.venv
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - QDRANT_URL=${QDRANT_URL}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - OLLAMA_HOST=http://host.docker.internal:11434
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: app-celery-worker

    command: >
      celery
      -A app.celery_app
      worker
      --loglevel=info
      --concurrency=4

    restart: unless-stopped

    depends_on:
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

    volumes:
      - .:/app
      - /app/.venv

    env_file:
      - .env

    environment:

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      CELERY_BROKER_URL: ${CELERY_BROKER_URL}

      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}



  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: app-celery-beat

    command: >
      celery
      -A app.celery_app
      beat
      --loglevel=info

    restart: unless-stopped

    depends_on:
      rabbitmq:
        condition: service_started

    volumes:
      - .:/app
      - /app/.venv

    env_file:
      - .env

    environment:

      CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672//

      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
  rabbitmq:
    image: rabbitmq:3-management

    container_name: app-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: app-frontend
    ports:
      - "5173:5173"
    restart: unless-stopped
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  qdrant:
    image: qdrant/qdrant:latest
    container_name: db-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    restart: unless-stopped
    volumes:
      - ./qdrant_storage:/qdrant/storage
  redis:
      image: redis:latest
      container_name: app_cache
      ports:
       - "6390:6379"
      restart: always
      env_file:
        - .env
      environment:
        - REDIS_USER=${REDIS_USER}
        - REDIS_PASSWORD=${REDIS_PASSWORD}

      command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]

      volumes:
        - redis_data:/data
  postgres:
    image: postgres:17
    container_name: db-postgres
    ports:
      - "5433:5432"
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: