    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "sqlmodel>=0.0.31",
    "asyncpg>=0.29.0",
    # AI / RAG
    "openai>=2.14.0",
    "llama-index>=0.14.12",
    "llama-index-core>=0.14.10",
    "llama-index-readers-file>=0.5.6",
